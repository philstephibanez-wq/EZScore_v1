security:
    password_hashers:
        App\Domain\User\User: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Domain\User\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js|assets)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\ActiveUserChecker
            custom_authenticators:
                - App\Security\GoogleAuthenticator
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_dashboard
            logout:
                path: app_logout
                target: app_login

    access_control:
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/assets/, roles: PUBLIC_ACCESS }
        - { path: ^/first-run, roles: PUBLIC_ACCESS }
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/registration/pending, roles: PUBLIC_ACCESS }
        - { path: ^/activation/resend, roles: PUBLIC_ACCESS }
        - { path: ^/activate/, roles: PUBLIC_ACCESS }
        - { path: ^/locale/, roles: PUBLIC_ACCESS }
        - { path: ^/connect/google, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/, roles: ROLE_USER }
